{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - RPA Target</title>
  <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body class="bg-light">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<div class="container mt-5">
  <div class="row">
    <div class="col-md-12">
      <h3 class="text-primary">Dashboard</h3>
      <p class="text-muted">Wellcome, <span class="badge bg-light text-primary border fs-6">{{ user.username }}</span> 👋</p>
    </div>
  </div>

  <div class="row mt-4">
    <!-- Menu Akun -->
    <div class="col-md-6 mb-4">
      <div class="card shadow-sm h-100 border-0">
        <div class="card-body text-center">
          <h5 class="card-title">Account</h5>
          <p class="card-text text-muted">View and change your account information.</p>
          <a href="{% url 'account' %}" class="btn btn-outline-primary w-100">Manage Account</a>
        </div>
      </div>
    </div>

    <!-- Menu Laporan -->
    <div class="col-md-6 mb-4">
      <div class="card shadow-sm h-100 border-0">
        <div class="card-body text-center">
          <h5 class="card-title">Report</h5>
          <p class="card-text text-muted">Filter reports by year and month, then download as PDF.</p>
          <a href="{% url 'report_list' %}" class="btn btn-outline-success w-100">View Report</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Tombol Logout -->
  <div class="row mt-4">
    <div class="col-md-12 text-center">
      <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
    </div>
  </div>
</div>

<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
