{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Report - RPA Target</title>
  <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <h3 class="text-primary">Report</h3>
  <p class="text-muted">Select a year to view the PDF report.</p>

  <!-- Form Filter -->
  <form method="get" action="{% url 'report_list' %}" class="row g-3 mt-3 align-items-end">
    <div class="col-md-4">
      <label for="year" class="form-label">Tahun</label>
      <select name="year" id="year" class="form-select" required>
        {% for y in years %}
          <option value="{{ y }}" {% if y|stringformat:"s" == year %}selected{% endif %}>{{ y }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-2">
      <button type="submit" class="btn btn-primary mt-4">Filter</button>
    </div>
  </form>

  <div class="container mt-4">
    <h4 class="text-primary mb-4">Annual Report {{ year }}</h4>
    <div class="row">
      {% for m in months %}
        <div class="col-md-3 mb-4">
          <div class="card shadow-sm h-100 {% if m.is_current %}border-success{% endif %}">
            <div class="card-body text-center">
              <h5 class="card-title">{{ m.name }}</h5>
              {% if m.report %}
                <a href="{{ m.report.file.url }}" class="btn btn-sm btn-outline-primary mt-2">
                  Download PDF
                </a>
              {% else %}
                <span class="badge bg-danger mt-2">No data</span>
              {% endif %}
            </div>
          </div>
        </div>
      {% endfor %}
    </div>
  </div>

  <div class="mt-4">
    <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Back to Dashboard</a>
  </div>
</div>

<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
